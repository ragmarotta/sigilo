{% extends "base.html" %}

{% block title %}Página Inicial - SIGILO{% endblock %}

{% block content %}
    {% if session['user'] %}
        <div class="row">
            <div id="message-panel" class="col s12">
                <div class="card-panel">
                    <h5 class="card-title">Criar Nova Mensagem Segura</h5>
                    <form action="{{ url_for('main.create_message') }}" method="post">
                        <div class="input-field col s12">
                            <textarea id="content" name="content" class="materialize-textarea" required></textarea>
                            <label for="content">Sua Mensagem</label>
                        </div>
                        <div class="input-field col s6">
                            <select id="expires_in" name="expires_in">
                                <option value="3600">1 Hora</option>
                                <option value="86400">1 Dia</option>
                                <option value="604800">7 Dias</option>
                                <option value="0">Sem expiração de tempo</option>
                            </select>
                            <label for="expires_in">Prazo de Expiração</label>
                        </div>
                        <div class="input-field col s6">
                            <input type="number" id="max_visits" name="max_visits" value="1" min="1" class="validate">
                            <label for="max_visits">Nº Máximo de Acessos</label>
                        </div>
                        <div class="input-field col s12">
                            <input type="email" id="recipient_email" name="recipient_email" class="validate">
                            <label for="recipient_email">E-mail do Destinatário (Opcional)</label>
                        </div>
                        <div class="col s12">
                            <button type="submit" class="btn waves-effect waves-light">Gerar Link Seguro</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="link-panel" class="col s12">
                <div class="card-panel">
                    <h5 class="card-title">Encurtar Nova URL</h5>
                    <form action="{{ url_for('main.create_link') }}" method="post">
                        <div class="input-field col s12">
                            <input type="url" id="long_url" name="long_url" required class="validate">
                            <label for="long_url">URL Original</label>
                        </div>
                        <div class="input-field col s12">
                            <select id="expires_in_link" name="expires_in_link">
                                <option value="86400">1 Dia</option>
                                <option value="604800">7 Dias</option>
                                <option value="2592000">30 Dias</option>
                                <option value="0">Sem expiração</option>
                            </select>
                            <label for="expires_in_link">Prazo de Expiração</label>
                        </div>
                        <div class="col s12">
                            <button type="submit" class="btn waves-effect waves-light">Encurtar URL</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    {% else %}
        <div class="card-panel blue lighten-4">
            <a href="{{ url_for('auth.login') }}">Faça login</a> para começar a compartilhar informações de forma segura.
        </div>
    {% endif %}
{% endblock %}
